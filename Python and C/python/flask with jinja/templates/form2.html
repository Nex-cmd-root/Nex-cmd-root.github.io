<!DOCTYPE html>
<html>
<head>
    <title>Web Database Entry Form</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; }
        form { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { margin: 10px; padding: 8px; width: 200px; font-size: 14px; }
        button { padding: 10px 20px; background-color: #333366; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .msg { color: #333366; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Student Registry Web Portal</h2>

    <!-- JINJA2 MAGIC: If a message exists, display it dynamically inside our DOM tree -->
    {% if alert_msg %}
        <p class="msg">{{ alert_msg }}</p>
    {% endif %}

    <form action="/submit" method="POST">
        <input type="text" name="form_name" placeholder="Enter Student Name" required><br>
        <input type="text" name="form_id" placeholder="Enter Student ID" required><br>
        <input type="text" name="form_grade" placeholder="Enter Grade" required><br>
        <button type="submit">Register Student</button>
    </form>

    <h3>Active Classroom Spreadsheet Roster</h3>
    <table border="1" style="margin: 0 auto; width: 80%; border-collapse: collapse; background: white;">
        <thead style="background-color: #333366; color: white;">
            <tr>
                <th style="padding: 10px;">ID Number</th>
                <th style="padding: 10px;">Full Name</th>
                <th style="padding: 10px;">Grade Mark</th>
            </tr>
        </thead>
        <tbody>
            <!-- JINJA MULTI-VARIABLE EXTRACTION LOOP -->
            {% for student in student_list %}
                <tr style="border-bottom: 1px solid #ddd;">
                    <!-- Use matching column header string keys defined in your CSV reader! -->
                    <td style="padding: 8px;">{{ student['Student ID'] }}</td>
                    <td style="padding: 8px;">{{ student['Student Name'] }}</td>
                    <td style="padding: 8px;">{{ student['Final Grade'] }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
